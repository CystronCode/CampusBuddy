name: Keep-Alive Ping
on:
  schedule:
    # Runs every 10 minutes continuously to prevent container sleeping
    - cron: '*/10 * * * *'
  workflow_dispatch:

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping Campus API Health Endpoint
        run: |
          TARGET="${{ secrets.BACKEND_URL }}"
          if [ -z "$TARGET" ]; then
            TARGET="https://campusos-api-5662.onrender.com"
          fi
          echo "Pinging health endpoint on: $TARGET"
          curl -f -s -S --max-time 30 "$TARGET/health" || curl -f -s -S --max-time 30 "$TARGET/api/healthz" || true
