name: CampusOS verification
on: [push, pull_request]
permissions:
  contents: read
jobs:
  backend:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env: {POSTGRES_DB: campus_test, POSTGRES_USER: postgres, POSTGRES_PASSWORD: postgres}
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U postgres -d campus_test"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: pip install -r requirements.txt
      - run: ruff check backend
      - run: alembic upgrade head
        env: {DATABASE_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/campus_test"}
      - run: python -m pytest --junitxml=artifacts/backend-tests.xml
        env: {TEST_POSTGRES_URL: "postgresql+psycopg://postgres:postgres@localhost:5432/campus_test"}
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: backend-results, path: artifacts/}
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: {node-version: "22", cache: npm, cache-dependency-path: frontend/package-lock.json}
      - uses: actions/setup-python@v5
        with: {python-version: "3.11", cache: pip}
      - run: python -m venv .venv && .venv/bin/pip install -r requirements.txt
      - run: npm ci
        working-directory: frontend
      - run: npm run typecheck && npm run build
        working-directory: frontend
      - run: npx playwright install --with-deps chromium
        working-directory: frontend
      - run: npm run test:e2e
        working-directory: frontend
      - uses: actions/upload-artifact@v4
        if: always()
        with: {name: browser-results, path: "artifacts/\nfrontend/test-results/"}
